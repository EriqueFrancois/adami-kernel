# pyproject.toml
[tool.poetry]
name = "adami-kernel"
version = "0.2.3"
description = "Industrial microkernel for distributed digital ecosystems"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "AGPL-3.0-or-later"
packages = [{include = "adami_kernel", from = "src"}]

[tool.poetry.scripts]
adami = "adami_kernel.kernel:main"
adami-train-agl = "adami_kernel.training.run_trainer:main"
adami-mcp-agent-smoke = "adami_kernel.integration.mcp_agent.adapter_smoke:main"
adami-replay-validate = "adami_kernel.integration.sim.replay_cli:main"
adami-replay-eval = "adami_kernel.integration.sim.replay_eval_cli:main"
adami-replay-run = "adami_kernel.integration.sim.replay_run_cli:main"
adami-replay-compare = "adami_kernel.integration.sim.replay_compare_cli:main"
adami-golden-trace-gen = "adami_kernel.integration.sim.golden_trace_gen:main"
adami-golden-trace-capture = "adami_kernel.integration.sim.golden_trace_capture:main"
adami-golden-trace-refresh = "adami_kernel.integration.sim.golden_trace_refresh_cli:main"
adami-ops-boot-check = "adami_kernel.ops.ops_boot_self_check_cli:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.14" # Must be <3.14 for agentops compatibility
pydantic = "^2.6.0"
pydantic-settings = "^2.6.0"
aiosqlite = "^0.20.0"
httpx = "^0.28.1"
beautifulsoup4 = "^4.14.3"
markdownify = "^1.2.2"
ddgs = "^9.11.2"
# mcp-agent (optional extra "mcp-agent") requires rich>=13.9.4, numpy>=2.1.3; see docs/mcp_agent_alignment.md §0
rich = ">=13.9.4,<14"
numpy = ">=2.1.3,<3"
psutil = "^6.1.0" # ← 兼容 agentops
pillow = "^12.1.1"
pyautogui = "^0.9.54"
duckduckgo-search = "^8.1.1"
python-dotenv = "^1.2.2"
discord-py = {version = "^2.7.1", extras = ["voice"]}
setuptools = "^70.0.0"
githubkit = "^0.12.0"
jinja2 = "^3.1.6"
feedparser = "^6.0.11"
# Optional extra "markitdown": Microsoft MarkItDown (pdf, docx, pptx, xlsx) -> Markdown. Pin ~0.1.x per upstream 0.1 breaking API notes.
markitdown = { version = "~0.1.5", extras = ["pdf", "docx", "pptx", "xlsx"], optional = true }

# ====================== 【Anthropic Skills 集成 - 步骤1.1 新增】 ======================
# python-frontmatter 用于解析 Anthropic SKILL.md 的 YAML frontmatter
python-frontmatter = "^1.1.0"
json-repair = "^0.55.0"
# ====================================================================================

# ====================== OpenTelemetry（内核默认可用） ======================
openai = "^2.8.0" # Required by litellm[proxy]
opentelemetry-api = "^1.35.0"
opentelemetry-sdk = "^1.35.0"
opentelemetry-exporter-otlp-proto-grpc = "^1.35.0"
# FastAPI + HTTPX auto-instrumentation (pairs with opentelemetry-api/sdk above).
opentelemetry-instrumentation-fastapi = ">=0.50b0,<0.62"
opentelemetry-instrumentation-httpx = ">=0.50b0,<0.62"
# --- Agent Lightning：可选 extra「training」，默认 poetry install 不装，避免污染轻量推理环境 ---
agentlightning = { version = ">=0.3.0,<0.4", optional = true }
mcp-agent = { version = "0.2.6", optional = true }
# ====================================================================================
chromadb = "^1.5.5"
cryptography = "^46.0"
docker = "^7.1.0"
ollama = "^0.6.1"
mlx-lm = "^0.31.1"
aiofiles = "^25.1.0"
aiogram = "^3.27.0"
fastapi = "^0.135.3"
uvicorn = "^0.44.0"

[tool.poetry.extras]
training = ["agentlightning"]
# 与方案一致：adami-kernel[mcp-agent] / poetry install -E mcp-agent
"mcp-agent" = ["mcp-agent"]
# 模块四步骤 6：外部 DeerFlow 侧车桥（HTTP/CLI）。桥接不引入 deer-flow 包；此 extra 作为“显式启用”标记。
deerflow-bridge = []
# Document -> Markdown (Step 1): poetry install -E markitdown
markitdown = ["markitdown"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.3.0"
pyright = "^1.1.350"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
black = "^26.3.1"
# Test-only: tiny PDFs with extractable text for document_markdown (Step 2).
reportlab = "^4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [".adami_data", ".adami_sandbox", "scripts", "skills"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "D"]
ignore = [
    # This codebase intentionally uses lazy imports to break cycles / optional deps.
    "E402",
    # We keep a few broad exception catches at top-level boundaries; tighten per-module later.
    "E722",
    "E501",
    # Docstring policy: enforce style/convention, not presence (commercial hardening can tighten later)
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    # Docstring style: keep checks lightweight for now (Google convention still applies).
    "D205",
    "D212",
    "D402",
    "D415",
    "D200",
    "D301",
    # Shadowing `t` in loops is common in i18n tests; avoid noisy lint.
    "F402",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src"]
exclude = ["tests", "scripts", "skills", "frontend", ".adami_data", ".adami_sandbox"]
pythonVersion = "3.10"
typeCheckingMode = "off"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603"]
"tests/test_multi_modal_document_path_step3.py" = ["S101", "S603", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204"]
"tests/test_markitdown_bridge.py" = ["S101", "S603", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204"]
"src/adami_kernel/training/**/*.py" = ["ANN401", "S603"]
"src/adami_kernel/observability/agl_compat.py" = ["ANN201", "ANN202", "ANN204", "ANN401"]
"src/adami_kernel/telemetry/experience_sink.py" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: 需要 Docker / Sim / MCP 等外部栈，默认 CI 可用 -m 'not integration' 排除",
    "stress: 压力/抖动用例；仅 replay-stress job 或手动 -m stress",
    "markitdown_bridge: Step 7 — MarkItDown↔unstructured bridge matrix (see tests/test_markitdown_bridge.py)",
]