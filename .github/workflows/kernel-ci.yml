# 与仓库根目录 ci.yml 保持同步（步骤 5：replay 门禁 + 可选 stress）
name: Kernel CI/CD Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 夜间 stress（UTC 02:00）
    - cron: "0 2 * * *"

jobs:
  compliance-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install
      - name: Doc paths — output examples + architecture links
        run: |
          set -euo pipefail
          for f in \
            docs/standard/en/output_examples_secondbrain_report.md \
            docs/standard/zh/output_examples_secondbrain_report.md \
            docs/standard/en/ARCHITECTURE.md \
            docs/standard/zh/ARCHITECTURE.md; do
            test -f "$f"
          done
          grep -q 'output_examples_secondbrain_report.md' docs/standard/en/ARCHITECTURE.md
          grep -q 'output_examples_secondbrain_report.md' docs/standard/zh/ARCHITECTURE.md
          grep -q 'output_examples_secondbrain_report.md' README.md
      - name: Shellcheck demo script (optional)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/examples/report_studio_to_secondbrain.sh
          fi
      - name: Report Studio offline demo script
        run: bash scripts/examples/report_studio_to_secondbrain.sh
      - name: Security & Syntax Audit
        run: poetry run ruff check src/ tests/
      - name: i18n — bare CJK string gate (Step 7, A-class paths)
        run: poetry run python scripts/check_no_bare_cjk_strings.py
      - name: i18n — user-visible string candidates (artifact for PR diff)
        run: poetry run python scripts/scan_user_visible_string_candidates.py --out reports/user_visible_string_candidates.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: user-visible-string-candidates
          path: reports/user_visible_string_candidates.tsv
          if-no-files-found: warn
      - name: Strict Type Checking
        run: poetry run pyright
      - name: Intent adaptive — offline test matrix (Step 9)
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 poetry run pytest \
            tests/test_intent_adaptive_* \
            tests/test_i18n_locale_key_parity.py \
            -q --tb=short
      - name: Kernel Core Tests (exclude integration + stress)
        run: poetry run pytest -m "not integration and not stress" --tb=short

  # Step 7: real MarkItDown + bridge matrix (extra not in default ``poetry install``).
  markitdown-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install -E markitdown
      - name: MarkItDown bridge — real docx + mocked-failure → fake unstructured
        run: poetry run pytest tests/test_markitdown_bridge.py -q --tb=short

  replay-traces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install
      - name: Sim — golden NDJSON replay & step 2 acceptance
        run: |
          poetry run pytest tests/replay/ \
            tests/test_acceptance_sim_step2_replay.py \
            -q --tb=short

  replay-stress:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install
      - name: Stress — replay + parallel validate (threshold 0 = any failure fails job)
        env:
          STRESS_FAILURE_THRESHOLD: "0"
        run: poetry run pytest -m stress -q --tb=short
