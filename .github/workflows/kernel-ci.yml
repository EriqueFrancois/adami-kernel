# 与仓库根目录 ci.yml 保持同步（步骤 5：replay 门禁 + 可选 stress）
name: Kernel CI/CD Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 夜间 stress（UTC 02:00）
    - cron: "0 2 * * *"

jobs:
  # Hard workaround for flaky "Post Run actions/checkout/setup-python" hangs:
  # - Avoid those actions entirely (manual git checkout, use runner python).
  # - Split into shorter jobs for faster feedback and easier reruns.
  lint-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (manual)
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry
      - name: Install deps
        run: poetry install --with dev
      - name: Doc paths — output examples + architecture links
        run: |
          set -euo pipefail
          for f in \
            docs/standard/en/output_examples_secondbrain_report.md \
            docs/standard/zh/output_examples_secondbrain_report.md \
            docs/standard/en/ARCHITECTURE.md \
            docs/standard/zh/ARCHITECTURE.md; do
            test -f "$f"
          done
          grep -q 'output_examples_secondbrain_report.md' docs/standard/en/ARCHITECTURE.md
          grep -q 'output_examples_secondbrain_report.md' docs/standard/zh/ARCHITECTURE.md
          grep -q 'output_examples_secondbrain_report.md' README.md
      - name: Shellcheck demo script (optional)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/examples/report_studio_to_secondbrain.sh
          fi
      - name: Report Studio offline demo script
        run: bash scripts/examples/report_studio_to_secondbrain.sh
      - name: Security & Syntax Audit
        run: poetry run ruff check src/ tests/
      - name: i18n — bare CJK string gate (Step 7, A-class paths)
        run: poetry run python scripts/check_no_bare_cjk_strings.py
      - name: i18n — user-visible string candidates (artifact for PR diff)
        run: poetry run python scripts/scan_user_visible_string_candidates.py --out reports/user_visible_string_candidates.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: user-visible-string-candidates
          path: reports/user_visible_string_candidates.tsv
          if-no-files-found: warn

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-gates]
    steps:
      - name: Checkout (manual)
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry
      - name: Install deps
        run: poetry install --with dev
      - name: Strict Type Checking
        run: poetry run pyright

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-gates]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONASYNCIODEBUG: "1"
      PYTHONWARNINGS: "default"
    steps:
      - name: Checkout (manual)
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry
      - name: Install deps
        run: poetry install --with dev
      - name: Sanity — pytest-asyncio available
        run: poetry run python -c "import pytest_asyncio; print('pytest-asyncio', getattr(pytest_asyncio, '__version__', 'unknown'))"
      - name: Intent adaptive — offline test matrix (Step 9)
        run: |
          timeout 20m poetry run python - <<'PY'
          from __future__ import annotations
          import os
          import subprocess
          import sys
          from glob import glob
          
          intent_tests = sorted(glob("tests/test_intent_adaptive_*.py"))
          if not intent_tests:
              print("No intent_adaptive tests matched tests/test_intent_adaptive_*.py", file=sys.stderr)
              os._exit(4)

          args = [
              sys.executable,
              "-m",
              "pytest",
              "-p",
              "pytest_asyncio.plugin",
              *intent_tests,
              "tests/test_i18n_locale_key_parity.py",
              "-q",
              "--tb=short",
          ]
          r = subprocess.run(args)
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(r.returncode)
          PY
      - name: Kernel Core Tests (exclude integration + stress)
        run: |
          timeout 35m poetry run python - <<'PY'
          from __future__ import annotations
          import os
          import subprocess
          import sys
          
          args = [
              sys.executable,
              "-m",
              "pytest",
              "-p",
              "pytest_asyncio.plugin",
              "-m",
              "not integration and not stress",
              "--tb=short",
          ]
          r = subprocess.run(args)
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(r.returncode)
          PY
      - name: Cleanup — kill stray processes (best-effort)
        if: always()
        run: |
          set -euo pipefail
          echo "== process snapshot =="
          ps -eo pid,ppid,stat,etime,cmd | head -n 40 || true
          echo "== kill common strays =="
          pkill -f "uvicorn" || true
          pkill -f "pytest" || true
          pkill -f "python -m pytest" || true
          pkill -f "adami_kernel" || true
          echo "== done =="

  # Step 7: real MarkItDown + bridge matrix (extra not in default ``poetry install``).
  markitdown-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-gates]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout (manual)
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry
      - name: Install deps (markitdown extra)
        run: poetry install --with dev -E markitdown
      - name: Sanity — pytest-asyncio available
        run: poetry run python -c "import pytest_asyncio; print('pytest-asyncio', getattr(pytest_asyncio, '__version__', 'unknown'))"
      - name: MarkItDown bridge — real docx + mocked-failure → fake unstructured
        run: poetry run pytest -p pytest_asyncio.plugin tests/test_markitdown_bridge.py -q --tb=short

  replay-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-gates]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout (manual)
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry
      - name: Install deps
        run: poetry install --with dev
      - name: Sanity — pytest-asyncio available
        run: poetry run python -c "import pytest_asyncio; print('pytest-asyncio', getattr(pytest_asyncio, '__version__', 'unknown'))"
      - name: Sim — golden NDJSON replay & step 2 acceptance
        run: |
          poetry run pytest -p pytest_asyncio.plugin tests/replay/ \
            tests/test_acceptance_sim_step2_replay.py \
            -q --tb=short
      - name: Sim — replay refs (compute baseline/head)
        run: |
          set -euo pipefail
          mkdir -p reports

          HEAD_SHA="$(git rev-parse HEAD)"
          # Fetch main so we can compute a merge-base baseline.
          git fetch --depth=200 origin main
          BASE_SHA="$(git merge-base origin/main HEAD)"
          echo "baseline sha: $BASE_SHA"
          echo "head sha: $HEAD_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Sim — replay eval (baseline)
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          poetry run adami-replay-eval \
            --suite-dir docs/evals/traces \
            --forbid "sk-" \
            --out-json reports/replay_eval_suite.baseline.json \
            --out-md reports/replay_eval_suite.baseline.md
      - name: Sim — replay run isomorphic (baseline, record-only)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          mkdir -p reports/isomorphic/baseline
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          
          gate = Path("docs/evals/traces/isomorphic_gate.json")
          raw = json.loads(gate.read_text(encoding="utf-8"))
          allow = [str(x) for x in (raw.get("allowlist") or []) if str(x).strip()]
          deny = {str(x) for x in (raw.get("denylist") or []) if str(x).strip()}
          allow = [x for x in allow if x not in deny]
          if not allow:
            print("isomorphic gate: empty allowlist", file=sys.stderr)
            os._exit(4)
          
          failures: list[str] = []
          for name in allow:
            trace = Path("docs/evals/traces") / name / "golden_trace.ndjson"
            out = Path("reports/isomorphic/baseline") / f"{name}.replayed.ndjson"
            if not trace.is_file():
              failures.append(f"missing_trace:{name}")
              continue
            cmd = [
              "poetry",
              "run",
              "python",
              "-m",
              "adami_kernel.integration.sim.replay_run_cli",
              str(trace),
              "--out-trace",
              str(out),
              "--verify-isomorphic",
            ]
            r = subprocess.run(cmd, text=True, capture_output=True)
            if r.returncode != 0:
              failures.append(f"isomorphic_fail:{name}")
              sys.stderr.write(f"\n== isomorphic FAIL {name} ==\n")
              sys.stderr.write(r.stdout)
              sys.stderr.write(r.stderr)
          
          if failures:
            # Record-only: do not fail CI for baseline; just print failures.
            print("\nIsomorphic baseline failures (record-only):", failures, file=sys.stderr)
            os._exit(0)
          print(f"isomorphic baseline PASS: {len(allow)} traces")
          PY
      - name: Sim — replay eval (head)
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          poetry run adami-replay-eval \
            --suite-dir docs/evals/traces \
            --forbid "sk-" \
            --out-json reports/replay_eval_suite.head.json \
            --out-md reports/replay_eval_suite.head.md
      - name: Sim — replay run isomorphic gate (head, strong gate)
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          mkdir -p reports/isomorphic/head
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          
          gate = Path("docs/evals/traces/isomorphic_gate.json")
          raw = json.loads(gate.read_text(encoding="utf-8"))
          allow = [str(x) for x in (raw.get("allowlist") or []) if str(x).strip()]
          deny = {str(x) for x in (raw.get("denylist") or []) if str(x).strip()}
          allow = [x for x in allow if x not in deny]
          if not allow:
            print("isomorphic gate: empty allowlist", file=sys.stderr)
            os._exit(4)
          
          failures: list[str] = []
          for name in allow:
            trace = Path("docs/evals/traces") / name / "golden_trace.ndjson"
            out = Path("reports/isomorphic/head") / f"{name}.replayed.ndjson"
            if not trace.is_file():
              failures.append(f"missing_trace:{name}")
              continue
            cmd = [
              "poetry",
              "run",
              "python",
              "-m",
              "adami_kernel.integration.sim.replay_run_cli",
              str(trace),
              "--out-trace",
              str(out),
              "--verify-isomorphic",
            ]
            r = subprocess.run(cmd, text=True, capture_output=True)
            if r.returncode != 0:
              failures.append(f"isomorphic_fail:{name}")
              sys.stderr.write(f"\n== isomorphic FAIL {name} ==\n")
              sys.stderr.write(r.stdout)
              sys.stderr.write(r.stderr)
          
          if failures:
            print("\nIsomorphic gate failures:", failures, file=sys.stderr)
            os._exit(2)
          print(f"isomorphic gate PASS: {len(allow)} traces")
          PY
      - name: Sim — replay run inject-all gate (baseline, record-only)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          mkdir -p reports/inject_all/baseline
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          
          gate = Path("docs/evals/traces/inject_all_gate.json")
          raw = json.loads(gate.read_text(encoding="utf-8"))
          allow = [str(x) for x in (raw.get("allowlist") or []) if str(x).strip()]
          deny = {str(x) for x in (raw.get("denylist") or []) if str(x).strip()}
          allow = [x for x in allow if x not in deny]
          if not allow:
            print("inject-all gate: empty allowlist", file=sys.stderr)
            os._exit(4)
          
          failures: list[str] = []
          for name in allow:
            trace = Path("docs/evals/traces") / name / "golden_trace.ndjson"
            out = Path("reports/inject_all/baseline") / f"{name}.replayed.ndjson"
            if not trace.is_file():
              failures.append(f"missing_trace:{name}")
              continue
            cmd = [
              "poetry",
              "run",
              "python",
              "-m",
              "adami_kernel.integration.sim.replay_run_cli",
              str(trace),
              "--out-trace",
              str(out),
              "--inject-all-records",
              "--verify-isomorphic",
            ]
            r = subprocess.run(cmd, text=True, capture_output=True, timeout=90)
            if r.returncode != 0:
              failures.append(f"inject_all_fail:{name}")
              sys.stderr.write(f"\n== inject-all FAIL {name} ==\n")
              sys.stderr.write(r.stdout)
              sys.stderr.write(r.stderr)
          
          if failures:
            print("\nInject-all baseline failures (record-only):", failures, file=sys.stderr)
            os._exit(0)
          print(f"inject-all baseline PASS: {len(allow)} traces")
          PY
      - name: Sim — replay run inject-all gate (head, strong gate)
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          mkdir -p reports/inject_all/head
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          
          gate = Path("docs/evals/traces/inject_all_gate.json")
          raw = json.loads(gate.read_text(encoding="utf-8"))
          allow = [str(x) for x in (raw.get("allowlist") or []) if str(x).strip()]
          deny = {str(x) for x in (raw.get("denylist") or []) if str(x).strip()}
          allow = [x for x in allow if x not in deny]
          if not allow:
            print("inject-all gate: empty allowlist", file=sys.stderr)
            os._exit(4)
          
          failures: list[str] = []
          for name in allow:
            trace = Path("docs/evals/traces") / name / "golden_trace.ndjson"
            out = Path("reports/inject_all/head") / f"{name}.replayed.ndjson"
            if not trace.is_file():
              failures.append(f"missing_trace:{name}")
              continue
            cmd = [
              "poetry",
              "run",
              "python",
              "-m",
              "adami_kernel.integration.sim.replay_run_cli",
              str(trace),
              "--out-trace",
              str(out),
              "--inject-all-records",
              "--verify-isomorphic",
            ]
            r = subprocess.run(cmd, text=True, capture_output=True, timeout=90)
            if r.returncode != 0:
              failures.append(f"inject_all_fail:{name}")
              sys.stderr.write(f"\n== inject-all FAIL {name} ==\n")
              sys.stderr.write(r.stdout)
              sys.stderr.write(r.stderr)
          
          if failures:
            print("\nInject-all gate failures:", failures, file=sys.stderr)
            os._exit(2)
          print(f"inject-all gate PASS: {len(allow)} traces")
          PY
      - name: Sim — fault injection smoke (head, expected failure)
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          mkdir -p reports/faults
          # This intentionally drops a critical decision event so evaluation should FAIL.
          set +e
          poetry run adami-replay-run \
            docs/evals/traces/planner_multistep/golden_trace.ndjson \
            --out-trace reports/faults/planner_multistep.faulted.ndjson \
            --faults docs/evals/traces/_faults/drop_branch_decision.json \
            --out-eval-json reports/faults/planner_multistep.faulted.eval.json \
            --out-eval-md reports/faults/planner_multistep.faulted.eval.md
          rc="$?"
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "fault injection smoke expected failure, got rc=0" >&2
            exit 2
          fi
          test -f reports/faults/planner_multistep.faulted.ndjson
          test -f reports/faults/planner_multistep.faulted.eval.json
          test -f reports/faults/planner_multistep.faulted.eval.md
      - name: Sim — replay compare (baseline vs head)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          poetry run adami-replay-compare \
            --baseline-json reports/replay_eval_suite.baseline.json \
            --head-json reports/replay_eval_suite.head.json \
            --max-score-drop 1 \
            --max-dim-drop 1 \
            --out-json reports/replay_compare.json \
            --out-md reports/replay_compare.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-eval-report
          path: |
            reports/replay_eval_suite.baseline.json
            reports/replay_eval_suite.baseline.md
            reports/replay_eval_suite.head.json
            reports/replay_eval_suite.head.md
            reports/replay_compare.json
            reports/replay_compare.md
            reports/isomorphic/baseline/*.replayed.ndjson
            reports/isomorphic/head/*.replayed.ndjson
            reports/inject_all/baseline/*.replayed.ndjson
            reports/inject_all/head/*.replayed.ndjson
            reports/faults/*.faulted.ndjson
            reports/faults/*.faulted.eval.json
            reports/faults/*.faulted.eval.md
          if-no-files-found: warn

  replay-stress:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint-and-gates]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout (manual)
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry
      - name: Install deps
        run: poetry install --with dev
      - name: Sanity — pytest-asyncio available
        run: poetry run python -c "import pytest_asyncio; print('pytest-asyncio', getattr(pytest_asyncio, '__version__', 'unknown'))"
      - name: Stress — replay + parallel validate (threshold 0 = any failure fails job)
        env:
          STRESS_FAILURE_THRESHOLD: "0"
        run: poetry run pytest -p pytest_asyncio.plugin -m stress -q --tb=short
